plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.0' // 3.1.0 or 3.1.4
	id 'io.spring.dependency-management' version '1.1.0' //1.1.0 or 1.1.3
}

group = 'com.packt'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral() //maintains all dependency files
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql' // uses postgres (not maria)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}
